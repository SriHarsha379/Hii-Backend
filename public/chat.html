    <h1>Socket.IO Chat Client</h1>
    <div id="status">Status: Disconnected</div>
    
    <form id="messageForm">
        <input type="text" id="messageInput" placeholder="Type a message..." style="width: 300px;">
        <button type="submit">Send</button>
    </form>
    
    <ul id="messages"></ul>

    <!-- Load Socket.IO client library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

         const JWT_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5YWJiZDU4NTZkYTkzMTBkYjBhZWY0YiIsImlhdCI6MTc3Mjg2MzAzMSwiZXhwIjoxNzk4NzgzMDMxfQ.gYqmrODcOr_dV8Jlnl4fHERj2a2n5-evydx2nHx6JVw"
        // Initialize Socket.IO client
//         const socket = io("https://hii.life", {
//           path: "/app/server/socket.io",
//   query: { token: JWT_TOKEN },
//   transports: ["websocket"]
//         });
        const socket = io("http://localhost:5000", {
          path: "/app/server/socket.io",
  query: { token: JWT_TOKEN },
  transports: ["websocket"]
        });

        // Connection event handlers
        socket.on("connect", (data) => {
            document.getElementById("status").innerText = 
                `Status: Connected (ID: ${socket.id})`;
            console.log("Connected to server with ID:", socket.id);
        });


        socket.on("disconnect", (reason) => {
            document.getElementById("status").innerText = 
                `Status: Disconnected (${reason})`;
            console.log("Disconnected:", reason);
        });


        socket.on("connect_error", (error) => {
            document.getElementById("status").innerText = 
                `Status: Connection Error - ${error.message}`;
            console.error("Connection error:", error);
        });

        socket.on("reconnect", (attemptNumber) => {
            document.getElementById("status").innerText = 
                `Status: Reconnected after ${attemptNumber} attempts`;
            console.log("Reconnected after", attemptNumber, "attempts");
        });


        // Message form submission
        document.getElementById("messageForm").addEventListener("submit", (e) => {
            e.preventDefault();
            
            const input = document.getElementById("messageInput");
            const message = input.value.trim();
            
            if (message && socket.connected) {
                // Send message to server
                socket.emit("chat message", message);
                input.value = "";
            }
        });



        // Listen for messages from server
        socket.on("chat message", (msg) => {
            const messages = document.getElementById("messages");
            const li = document.createElement("li");
            li.textContent = msg;
            messages.appendChild(li);
        });
